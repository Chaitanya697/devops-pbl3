apiVersion: apps/v1
kind: Deployment
metadata:
  name: tikaa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tikaa
  template:
    metadata:
      labels:
        app: tikaa
    spec:
      containers:
        - name: tikaa
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: tikaa
spec:
  type: NodePort
  selector:
    app: tikaa
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
